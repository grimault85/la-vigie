name: Compiler La Vigie

# Deux façons de lancer une compilation :
#  1. Manuellement : onglet « Actions » du dépôt → « Compiler La Vigie » → « Run workflow »
#  2. Par version : en poussant une étiquette, par ex.
#       git tag v1.9.5
#       git push origin v1.9.5
#     Une « Release » est alors créée avec les fichiers d'installation ET les
#     fichiers latest.yml / .blockmap necessaires à la mise à jour automatique.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
            cible: --win --x64
          - os: macos-latest
            nom: macOS (Intel + Apple Silicon)
            cible: --mac --x64 --arm64

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'interface
        run: npx vite build

      - name: Construire l'application
        env:
          # Pas de certificat de signature : on évite que la compilation échoue
          # en cherchant une identité inexistante.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish never : c'est le job « publier » qui attache les fichiers,
        # afin de garder la main sur le contenu exact de la Release.
        run: npx electron-builder ${{ matrix.cible }} --publish never

      - name: Récupérer les fichiers d'installation
        uses: actions/upload-artifact@v4
        with:
          name: La-Vigie-${{ matrix.nom }}
          retention-days: 30
          if-no-files-found: error
          # latest.yml, latest-mac.yml et .blockmap sont INDISPENSABLES :
          # sans eux, les postes déjà installés ne détectent aucune version.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap

  publier:
    name: Publier la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rassembler les fichiers
        uses: actions/download-artifact@v4
        with:
          path: fichiers

      - name: Vérifier la présence des fichiers de mise à jour
        run: |
          echo "Fichiers récupérés :"
          find fichiers -type f | sort
          if ! find fichiers -name "latest.yml" | grep -q .; then
            echo "::error::latest.yml absent - la mise à jour automatique Windows ne fonctionnerait pas."
            exit 1
          fi

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          name: La Vigie ${{ github.ref_name }}
          generate_release_notes: true
          files: fichiers/**/*
